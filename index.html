<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATRIX — Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0a0a;
    --panel:#141414;
    --panel-2:#1c1c1c;
    --line:#2a2a2a;
    --chrome-1:#f4f4f4;
    --chrome-2:#c9c9c9;
    --chrome-3:#8f8f8f;
    --chrome-4:#5c5c5c;
    --white:#ffffff;
    --muted:#9a9a9a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--black);
    color:var(--white);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Archivo Black',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  a{color:inherit;text-decoration:none;}
  .chrome-text{
    background:linear-gradient(180deg,var(--chrome-1) 0%,var(--chrome-3) 45%,var(--chrome-1) 55%,var(--chrome-4) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .chrome-bar{
    height:3px;
    width:100%;
    background:repeating-linear-gradient(100deg,var(--chrome-4) 0 4px,var(--chrome-1) 4px 8px,var(--chrome-3) 8px 14px,var(--chrome-2) 14px 20px);
  }
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(10,10,10,0.9);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    max-width:1200px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 24px;
  }
  .logo{font-size:22px;letter-spacing:1px;}
  .nav-right{display:flex;align-items:center;gap:22px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
  .nav-right a:hover{color:var(--white);}
  .cart-btn{
    position:relative;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--white);
    padding:10px 16px;
    border-radius:2px;
    cursor:pointer;
    font-family:inherit;font-size:13px;letter-spacing:1px;text-transform:uppercase;
    transition:border-color .2s;
  }
  .cart-btn:hover{border-color:var(--chrome-2);}
  .cart-count{
    position:absolute;top:-8px;right:-8px;
    background:var(--white);color:var(--black);
    font-size:11px;font-weight:700;
    width:18px;height:18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .hero{
    max-width:1200px;margin:0 auto;
    padding:90px 24px 60px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:12px;letter-spacing:3px;color:var(--chrome-2);
    text-transform:uppercase;margin-bottom:18px;
    display:flex;align-items:center;gap:10px;
  }
  .eyebrow::before{content:'';width:26px;height:1px;background:var(--chrome-3);}
  .hero h1{
    font-size:clamp(40px,7vw,84px);
    line-height:0.95;
    max-width:820px;
  }
  .hero p{
    margin-top:22px;
    max-width:520px;
    color:var(--muted);
    font-size:16px;
    line-height:1.6;
  }
  main{max-width:1200px;margin:0 auto;padding:60px 24px 100px;}
  .section-head{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:32px;
  }
  .section-head h2{font-size:26px;}
  .section-head span{color:var(--muted);font-size:13px;letter-spacing:1px;}
  .cat-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
  .chip{
    background:var(--panel);border:1px solid var(--line);color:var(--muted);
    padding:8px 16px;border-radius:20px;cursor:pointer;font-family:inherit;
    font-size:12px;letter-spacing:0.5px;text-transform:uppercase;
    transition:border-color .2s,color .2s;
  }
  .chip:hover{color:var(--white);border-color:var(--chrome-3);}
  .chip.active{
    background:linear-gradient(180deg,var(--chrome-1),var(--chrome-3));
    color:var(--black);border-color:transparent;font-weight:700;
  }
  .cat-tag{
    display:inline-block;font-size:10px;letter-spacing:0.8px;text-transform:uppercase;
    color:var(--chrome-2);border:1px solid var(--line);border-radius:20px;
    padding:2px 9px;margin-bottom:2px;width:fit-content;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:22px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:3px;
    overflow:hidden;
    display:flex;flex-direction:column;
    transition:transform .2s, border-color .2s;
  }
  .card:hover{transform:translateY(-3px);border-color:var(--chrome-2);}
  .card-img{
    aspect-ratio:1/1;
    background:var(--panel-2) center/cover no-repeat;
    display:flex;align-items:center;justify-content:center;
    color:var(--chrome-4);
    font-size:12px;letter-spacing:1px;
    filter:grayscale(1) contrast(1.05);
  }
  .card-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .card-body h3{font-size:14px;letter-spacing:0.3px;font-weight:700;font-family:'Inter',sans-serif;text-transform:none;}
  .card-body .desc{font-size:12.5px;color:var(--muted);line-height:1.5;flex:1;}
  .card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
  .price{font-family:'Archivo Black',sans-serif;font-size:16px;}
  .bdt-tag{font-family:'Inter',sans-serif;font-weight:500;font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0;}
  .add-btn{
    background:linear-gradient(180deg,var(--chrome-1),var(--chrome-3));
    color:var(--black);
    border:none;padding:9px 14px;border-radius:2px;
    font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:700;
    cursor:pointer;
  }
  .add-btn:hover{filter:brightness(1.08);}
  .add-btn:disabled{opacity:.4;cursor:not-allowed;}
  .empty{color:var(--muted);font-size:14px;padding:40px 0;text-align:center;border:1px dashed var(--line);border-radius:4px;}

  /* Cart drawer */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:90;
  }
  .overlay.open{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:min(380px,90vw);
    background:var(--panel);border-left:1px solid var(--line);
    transform:translateX(100%);transition:transform .3s;
    z-index:100;display:flex;flex-direction:column;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{
    padding:20px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;
  }
  .drawer-head h3{font-size:16px;}
  .close-btn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;}
  .drawer-items{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px;}
  .cart-item{display:flex;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px;}
  .cart-item img{width:56px;height:56px;object-fit:cover;border-radius:2px;filter:grayscale(1);background:var(--panel-2);}
  .cart-item .ci-info{flex:1;}
  .cart-item .ci-info h4{font-size:13px;margin-bottom:4px;}
  .ci-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
  .qty-btn{background:var(--panel-2);border:1px solid var(--line);color:var(--white);width:20px;height:20px;cursor:pointer;border-radius:2px;}
  .remove-link{color:var(--muted);text-decoration:underline;cursor:pointer;font-size:11px;margin-left:auto;}
  .drawer-foot{padding:20px;border-top:1px solid var(--line);}
  .total-row{display:flex;justify-content:space-between;margin-bottom:14px;font-size:15px;}
  .total-row #cartTotal{font-size:13px;text-align:right;}
  .checkout-btn{
    width:100%;padding:13px;border:none;border-radius:2px;
    background:linear-gradient(180deg,var(--chrome-1),var(--chrome-3));
    color:var(--black);font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:13px;
    cursor:pointer;
  }
  .checkout-btn:disabled{opacity:.4;cursor:not-allowed;}

  /* Modal (checkout) */
  .modal{
    position:fixed;inset:0;z-index:110;display:none;
    align-items:center;justify-content:center;
    background:rgba(0,0,0,0.7);padding:20px;
  }
  .modal.open{display:flex;}
  .modal-box{
    background:var(--panel);border:1px solid var(--line);
    width:100%;max-width:420px;border-radius:4px;padding:26px;
  }
  .modal-box h3{font-size:18px;margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  .field input,.field textarea{
    width:100%;background:var(--black);border:1px solid var(--line);color:var(--white);
    padding:10px 12px;border-radius:2px;font-family:inherit;font-size:14px;
  }
  .field input:focus,.field textarea:focus{outline:1px solid var(--chrome-2);}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .btn-secondary{
    flex:1;padding:12px;background:none;border:1px solid var(--line);color:var(--white);
    border-radius:2px;cursor:pointer;font-family:inherit;letter-spacing:0.5px;
  }
  .btn-primary{
    flex:1;padding:12px;border:none;border-radius:2px;cursor:pointer;
    background:linear-gradient(180deg,var(--chrome-1),var(--chrome-3));
    color:var(--black);font-weight:700;letter-spacing:0.5px;font-family:inherit;
  }
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--white);color:var(--black);padding:12px 22px;border-radius:3px;
    font-size:13px;font-weight:600;letter-spacing:0.3px;opacity:0;transition:all .25s;z-index:200;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  footer{
    border-top:1px solid var(--line);
    padding:26px 24px;
    display:flex;justify-content:space-between;align-items:center;
    max-width:1200px;margin:0 auto;
    font-size:12px;color:var(--muted);letter-spacing:0.5px;
  }
  footer a{color:var(--muted);}
  footer a:hover{color:var(--white);}
  @media(max-width:640px){
    .nav-right{gap:12px;}
    .nav-right span.label{display:none;}
  }
</style>
</head>
<body>

<header>
  <div class="nav">
    <div class="logo display chrome-text">MATRIX</div>
    <div class="nav-right">
      <button class="cart-btn" id="cartOpenBtn">Cart <span class="cart-count" id="cartCount">0</span></button>
    </div>
  </div>
  <div class="chrome-bar"></div>
</header>

<section class="hero">
  <div class="eyebrow">Machined finish, monochrome catalogue</div>
  <h1>Objects worth<br>the polish.</h1>
  <p>A small, rotating collection — every piece shot in black and white, priced in the open. No noise, no color, just the object.</p>
</section>

<main>
  <div class="section-head">
    <h2>Catalogue</h2>
    <span id="itemCountLabel">0 items</span>
  </div>
  <div class="cat-filters" id="catFilters"></div>
  <div class="grid" id="productGrid"></div>
</main>

<footer>
  <span>© <span id="year"></span> MATRIX</span>
  <a href="page.html">Admin</a>
</footer>

<!-- Cart Drawer -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="cartDrawer">
  <div class="drawer-head">
    <h3>Your cart</h3>
    <button class="close-btn" id="cartCloseBtn">&times;</button>
  </div>
  <div class="drawer-items" id="cartItems"></div>
  <div class="drawer-foot">
    <div class="total-row"><span>Total</span><span id="cartTotal">$0.00</span></div>
    <button class="checkout-btn" id="checkoutBtn" disabled>Checkout</button>
  </div>
</aside>

<!-- Checkout Modal -->
<div class="modal" id="checkoutModal">
  <div class="modal-box">
    <h3>Delivery details</h3>
    <form id="checkoutForm">
      <div class="field"><label>Full name</label><input type="text" id="custName" required></div>
      <div class="field"><label>Phone</label><input type="tel" id="custPhone" required></div>
      <div class="field"><label>Address</label><textarea id="custAddress" rows="3" required></textarea></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="checkoutCancel">Cancel</button>
        <button type="submit" class="btn-primary">Place order</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="main.js"></script>
</body>
</html>
